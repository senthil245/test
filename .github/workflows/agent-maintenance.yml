name: agent-maintenance

on:
  pull_request:
    paths: ["agents/**", "config/**", "evals/**", "src/**", "tests/**"]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC — catches model retirements with no code change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      # Hook your eval harness in here: it should write evals/results/<agent>.json.
      # - name: Run evals
      #   run: python -m your_eval_harness --out evals/results/
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Maintenance checks
        run: |
          agent-maint check --format markdown --output reports/maintenance-report.md --fail-on never
          cat reports/maintenance-report.md >> "$GITHUB_STEP_SUMMARY"
          agent-maint check --fail-on error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-report
          path: reports/
